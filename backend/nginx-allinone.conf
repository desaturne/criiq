# All-in-one image: nginx serves the built UI and proxies the API on the same
# port, so the whole system is reachable through a single published port.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/auth/login -> 127.0.0.1:8000/auth/login  (trailing slash strips /api)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Simulation and optimisation runs are CPU-heavy; don't cut them off.
        proxy_read_timeout 600s;
    }

    # SPA fallback: react-router owns the URLs, not the filesystem
    location / {
        try_files $uri $uri/ /index.html;
    }
}
