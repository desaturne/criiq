# Optional — you do not need this file.
#
# The whole system is one image, so a single command is enough:
#
#     docker run -p 5173:80 dipa126/criiq:demo
#
# This compose file does exactly the same thing, just with `docker compose up`
# instead, and restarts the container automatically if it crashes.
#
# Open http://localhost:5173 and log in with:  rahul@criiq.local / coach1234

services:
  criiq:
    image: dipa126/criiq:demo
    ports:
      - "5173:80"
    restart: unless-stopped
