services:
  # FastAPI + the criiq_models CLI (invoked as a subprocess via model_bridge.py,
  # which is why they share one container rather than being split in two).
  backend:
    build:
      context: .                      # repo root: the image needs backend/ AND model-training/
      dockerfile: backend/Dockerfile
    image: criiq-backend
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-criiq-dev-secret-change-me}
    volumes:
      # criiq.db is ~450 MB and untracked — mounted, never baked into the image.
      # Read-only because data-collection owns this file (see database.py).
      - ./data-collection/data:/data:ro
      # Trained model artifacts (~32 MB, untracked, regenerated by training runs).
      - ./model-training/artifacts:/artifacts:ro
      # app.db + auth.db live in a named volume so they survive `compose down`
      # and avoid macOS bind-mount file locking problems with SQLite.
      - backend-state:/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Vite build output served by nginx.
  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at BUILD time by Vite — changing it requires a rebuild.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: criiq-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # The pipeline that BUILDS criiq.db. Not started by `compose up` — it is a
  # task, not a service. Run stages explicitly:
  #   docker compose run --rm data-collection refresh
  data-collection:
    profiles: ["pipeline"]
    build:
      context: ./data-collection
      dockerfile: Dockerfile
    image: criiq-data
    volumes:
      - ./data-collection/data:/data   # read-write: this service owns the DB

volumes:
  backend-state:
